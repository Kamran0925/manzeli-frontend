name: Deploy App to S3

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '22'

    - name: Install dependencies
      run: yarn install

    - name: Create .env file
      run: |
        echo "REACT_APP_MANZELI_API_URL=${{ secrets.REACT_APP_MANZELI_API_URL }}" >> .env
        echo "REACT_APP_X_CSRF_TOKEN=${{ secrets.REACT_APP_X_CSRF_TOKEN }}" >> .env
        echo "REACT_APP_AUTH_TOKEN=${{ secrets.REACT_APP_AUTH_TOKEN }}" >> .env
      env:
        REACT_APP_MANZELI_API_URL: ${{ secrets.REACT_APP_MANZELI_API_URL }}
        REACT_APP_X_CSRF_TOKEN: ${{ secrets.REACT_APP_X_CSRF_TOKEN }}
        REACT_APP_AUTH_TOKEN: ${{ secrets.REACT_APP_AUTH_TOKEN }}

    - name: Build app
      run: yarn build
      env:
        CI: false

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: me-central-1

    - name: Deploy to S3
      run: |
        aws s3 sync build/ s3://${{ secrets.AWS_S3_BUCKET }} --delete
        aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
      env:
        AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}